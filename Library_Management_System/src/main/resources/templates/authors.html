<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Authors | LibraryHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">Author Management</h2>
            <p class="text-muted mb-0">
                Manage your library authors
            </p>
        </div>

        <a th:href="@{/authors/new}" class="btn btn-primary">
            + Add New Author
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Error Message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${errorMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>


    <!-- Author Table -->
    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>
                        <th>Author ID</th>
                        <th>Author Name</th>
                        <th>Actions</th>
                    </tr>

                    </thead>


                    <tbody>

                    <!-- Display Authors -->
                    <tr th:each="author : ${authors}">

                        <td th:text="${author.authorId}"></td>

                        <td class="fw-semibold"
                            th:text="${author.authorName}">
                        </td>

                        <td>

                            <!-- Delete Author -->
                            <form th:action="@{/authors/delete/{id}(id=${author.authorId})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this author?');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">

                                    Delete

                                </button>

                            </form>

                        </td>

                    </tr>


                    <!-- Empty Author List -->
                    <tr th:if="${#lists.isEmpty(authors)}">

                        <td colspan="3"
                            class="text-center py-4 text-muted">

                            No authors found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Dashboard Button -->
    <a th:href="@{/dashboard}"
       class="btn btn-outline-secondary mt-3">

        Back to Dashboard

    </a>

</div>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
