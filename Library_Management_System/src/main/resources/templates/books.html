
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>All Books | LibraryHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">Book Management</h2>
            <p class="text-muted mb-0">Manage your library collection</p>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/books/new}" class="btn btn-primary">
                + Add New Book
            </a>

            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                Dashboard
            </a>
        </div>

    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${successMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${errorMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- Books Table -->
    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Book Name</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="book : ${books}">

                        <td th:text="${book.bookId}"></td>

                        <td class="fw-semibold"
                            th:text="${book.bookName}"></td>

                        <td th:text="${book.title}"></td>

                        <td th:text="${book.author != null ?
                                      book.author.authorName : 'N/A'}"></td>

                        <td>
                            ₹<span th:text="${book.price}"></span>
                        </td>

                        <td>
                            <span class="badge bg-success-subtle text-success"
                                  th:text="${book.quantity}">
                            </span>
                        </td>

                        <!-- Actions -->
                        <td>
                            <form th:action="@{/books/delete/{id}(id=${book.bookId})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this book? This action cannot be undone.');">

                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">

                                    Delete
                                </button>

                            </form>
                        </td>

                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(books)}">

                        <td colspan="7"
                            class="text-center text-muted py-5">

                            No books found. Add your first book!

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
