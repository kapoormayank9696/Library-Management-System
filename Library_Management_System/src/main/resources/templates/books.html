<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books | LibraryHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <a th:href="@{/dashboard}" class="brand">▣ LibraryHub</a>
        <p class="nav-label">WORKSPACE</p>
        <a class="nav-link" th:href="@{/dashboard}">▦ Dashboard</a>
        <a class="nav-link active" th:href="@{/books}">▤ All Books</a>
        <a class="nav-link" th:href="@{/books/new}">＋ Add Book</a>
        <div class="sidebar-bottom">Library Management System</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Book Catalogue</h1>
                <p class="muted">Manage and organize your collection.</p>
            </div>
            <a th:href="@{/books/new}" class="btn btn-primary">
                + Add New Book
            </a>
        </header>

        <section class="content-card">
            <div class="section-heading">
                <div>
                    <h2>All Books</h2>
                    <p class="muted">
                        Total records:
                        <strong th:text="${#lists.size(books)}">0</strong>
                    </p>
                </div>
            </div>

            <input id="bookSearch"
                   class="form-control mb-4"
                   type="search"
                   placeholder="Search by title, author or category...">

            <div class="table-responsive">
                <table class="table align-middle" id="booksTable">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.title}">Title</td>
                        <td th:text="${book.author}">Author</td>
                        <td th:text="${book.category}">Category</td>
                        <td th:text="${book.availableCopies}">0</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/books/edit/{id}(id=${book.id})}">
                                    Edit
                                </a>
                                <form th:action="@{/books/delete/{id}(id=${book.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this book?')">
                                    <button class="btn btn-sm btn-outline-danger"
                                            type="submit">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="5" class="text-center py-4">
                            No books available. Add your first book.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
