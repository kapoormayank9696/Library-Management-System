
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add New Book | LibraryHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">

        <div class="card-body p-4">

            <h2 class="mb-4">Add New Book</h2>

            <form th:action="@{/books}"
                  th:object="${book}"
                  method="post">

                <!-- Book Name -->
                <div class="mb-3">

                    <label class="form-label">Book Name</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{bookName}"
                           placeholder="Enter book name">

                    <small class="text-danger"
                           th:errors="*{bookName}"></small>

                </div>

                <!-- Title -->
                <div class="mb-3">

                    <label class="form-label">Title</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{title}"
                           placeholder="Enter title">

                    <small class="text-danger"
                           th:errors="*{title}"></small>

                </div>

                <!-- Author -->
                <div class="mb-3">

                    <label class="form-label">Author</label>

                    <select class="form-select"
                            th:field="*{authorId}">

                        <option value="">Select Author</option>

                        <option th:each="author : ${authors}"
                                th:value="${author.authorId}"
                                th:text="${author.authorName}">
                        </option>

                    </select>

                    <small class="text-danger"
                           th:errors="*{authorId}"></small>

                </div>

                <!-- Price -->
                <div class="mb-3">

                    <label class="form-label">Price</label>

                    <input type="number"
                           step="0.01"
                           class="form-control"
                           th:field="*{price}"
                           placeholder="Enter price">

                    <small class="text-danger"
                           th:errors="*{price}"></small>

                </div>

                <!-- Quantity -->
                <div class="mb-4">

                    <label class="form-label">Quantity</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{quantity}"
                           min="0"
                           placeholder="Enter quantity">

                    <small class="text-danger"
                           th:errors="*{quantity}"></small>

                </div>

                <a th:href="@{/dashboard}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    Add Book
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
