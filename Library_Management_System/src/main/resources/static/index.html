<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h2>📚 Library Management System</h2>
    <nav>
        <button data-tab="books" class="tab active">Books</button>
        <button data-tab="authors" class="tab">Authors</button>
        <button data-tab="users" class="tab">Users</button>
        <button data-tab="borrows" class="tab">Borrow / Return</button>
    </nav>
</header>

<main>
    <p id="msg" class="msg"></p>

    <!-- BOOKS -->
    <section id="books" class="panel">
        <div class="card">
            <h3>Add Book</h3>
            <form id="bookForm" class="row">
                <input id="bookName" placeholder="Book name (unique)" maxlength="50" required>
                <input id="bookTitle" placeholder="Title" maxlength="100" required>
                <input id="bookPrice" type="number" step="0.01" min="0" placeholder="Price" required>
                <input id="bookQty" type="number" min="0" value="1" placeholder="Quantity" required>
                <select id="bookAuthor" required></select>
                <button>Add Book</button>
            </form>
        </div>
        <div class="card">
            <h3>All Books</h3>
            <input id="bookSearch" placeholder="Search by name, title or author...">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Title</th><th>Author</th><th>Price</th><th>Qty</th><th></th></tr></thead>
                <tbody id="bookRows"></tbody>
            </table>
        </div>
    </section>

    <!-- AUTHORS -->
    <section id="authors" class="panel hidden">
        <div class="card">
            <h3>Add Author</h3>
            <form id="authorForm" class="row">
                <input id="authorName" placeholder="Author name" maxlength="50" required>
                <button>Add Author</button>
            </form>
        </div>
        <div class="card">
            <h3>All Authors</h3>
            <table>
                <thead><tr><th>ID</th><th>Name</th><th></th></tr></thead>
                <tbody id="authorRows"></tbody>
            </table>
        </div>
    </section>

    <!-- USERS -->
    <section id="users" class="panel hidden">
        <div class="card">
            <h3>Add User</h3>
            <form id="userForm" class="row">
                <input id="userName" placeholder="Username" maxlength="50" required>
                <input id="userEmail" type="email" placeholder="Email" maxlength="50" required>
                <button>Add User</button>
            </form>
        </div>
        <div class="card">
            <h3>All Users</h3>
            <table>
                <thead><tr><th>ID</th><th>Username</th><th>Email</th><th></th></tr></thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
    </section>

    <!-- BORROW -->
    <section id="borrows" class="panel hidden">
        <div class="card">
            <h3>Borrow a Book</h3>
            <form id="borrowForm" class="row">
                <select id="borrowUser" required></select>
                <select id="borrowBook" required></select>
                <input id="borrowDate" type="date" required>
                <button>Borrow</button>
            </form>
        </div>
        <div class="card">
            <h3>Borrow Records</h3>
            <table>
                <thead><tr><th>ID</th><th>User</th><th>Book</th><th>Borrowed</th><th>Returned</th><th></th></tr></thead>
                <tbody id="borrowRows"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
